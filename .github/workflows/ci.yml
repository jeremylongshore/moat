# Moat – Continuous Integration
#
# Triggers:
#   - Push to main  (post-merge gate, protects the default branch)
#   - Pull request targeting main  (pre-merge gate, fast feedback)
#
# Job graph:
#   lint ──┬── test ──┬── security
#          │          └── integration (main only)
#          └── docker (3× parallel: gateway, control-plane, trust-plane)
#   typecheck  (parallel, continue-on-error)
#
# Design decisions:
#   - All jobs install packages in editable mode (-e) so import paths match
#     the repo layout exactly – no surprises between local and CI.
#   - The test job uploads a coverage artefact so it can be inspected on
#     failure without re-running the suite.
#   - pip-audit is a separate job (not part of `test`) so it never blocks
#     the test result when a transitive dep has a fresh advisory.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR when a new push arrives.
# This keeps the runner queue clean and gives faster PR feedback.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # lint
  # Ruff: check for errors + enforce formatting (no writes).
  # Fail fast – no point running tests on badly formatted code.
  # ───────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install 'ruff>=0.16,<0.17'

      - name: ruff check (lint)
        run: ruff check packages/ services/

      - name: ruff format --check (formatting)
        run: ruff format --check packages/ services/

  # ───────────────────────────────────────────────────────────────────────────
  # typecheck
  # mypy – blocking. Every package is clean as of 2026-09-25.
  # ───────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    # Intentionally does NOT need lint to finish – runs in parallel.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install all packages (editable) + dev deps
        run: |
          pip install 'mypy>=1.9.0' 'pydantic>=2.0.0'
          pip install -e packages/core
          pip install -e packages/cli
          pip install -e services/control-plane
          pip install -e services/gateway
          pip install -e services/trust-plane
          pip install -e services/mcp-server

      - name: mypy
        # One run per package. Four services each ship a top-level `app` package, so a
        # single whole-tree run died on 'Duplicate module named "app"' before checking
        # anything. Every package is checked; the step fails if any of them does.
        run: |
          rc=0
          for target in packages/core packages/cli services/control-plane services/gateway services/trust-plane services/mcp-server; do
            echo "::group::mypy $target"
            (cd "$target" && mypy . --config-file "$GITHUB_WORKSPACE/pyproject.toml") || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

  # ───────────────────────────────────────────────────────────────────────────
  # test
  # Full pytest suite with coverage. Fails the build on any test failure.
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    needs: [lint]   # Don't burn runner minutes if lint fails.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # Install moat-core + all runtime deps needed by services.
      # Do NOT pip install -e services/* (they all share the 'app' package
      # name and editable installs collide). Instead, use PYTHONPATH to
      # point each test step at the correct service's app package.
      - name: Install dependencies
        run: |
          pip install -e packages/core
          pip install httpx fastapi uvicorn pydantic-settings web3 eth-account

      - name: Test packages/core
        run: |
          cd packages/core
          pytest --tb=short -v \
            --cov=moat_core \
            --cov-report=term-missing \
            --cov-report=xml:../../coverage-core.xml \
            tests/

      - name: Test services/control-plane
        env:
          PYTHONPATH: services/control-plane
        run: pytest --tb=short -v services/control-plane/tests/

      - name: Test services/gateway
        env:
          PYTHONPATH: services/gateway
        run: pytest --tb=short -v services/gateway/tests/

      - name: Merge coverage
        if: always()
        run: |
          cp coverage-core.xml coverage.xml || true

      - name: Upload coverage report
        if: always()   # Upload even if tests fail – helps diagnose failures.
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # security
  # pip-audit scans all installed packages for known CVEs.
  # Runs after test so it benefits from the warm pip cache, but is a
  # separate job so a new CVE advisory doesn't mask test results.
  # ───────────────────────────────────────────────────────────────────────────
  security:
    name: Security (pip-audit)
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pip-audit + all project packages
        run: |
          pip install 'pip-audit>=2.7.0'
          pip install -r requirements-dev.txt
          pip install -e packages/core
          pip install -e packages/cli
          pip install -e services/control-plane
          pip install -e services/gateway
          pip install -e services/trust-plane
          pip install -e services/mcp-server

      - name: Run pip-audit
        # Output as JSON so it can be parsed by security dashboards.
        # --fix is intentionally omitted – we want to review before upgrading.
        run: pip-audit --format=json --output=pip-audit.json || true

      - name: Display audit results
        if: always()
        run: |
          python3 -c "
          import json, sys
          data = json.load(open('pip-audit.json'))
          vulns = data.get('vulnerabilities', [])
          if not vulns:
              print('No known vulnerabilities found.')
              sys.exit(0)
          print(f'WARNING: {len(vulns)} vulnerability/ies found:')
          for v in vulns:
              print(f'  {v[\"name\"]} {v[\"version\"]}: {v[\"id\"]}')
          # Don't fail CI for now – treat as advisory.
          "

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: pip-audit.json
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # docker
  # Verify all service Dockerfiles build cleanly.
  # Uses BuildKit layer caching via GitHub Actions cache.
  # ───────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint]

    strategy:
      matrix:
        service:
          - { name: gateway, context: ".", dockerfile: services/gateway/Dockerfile }
          - { name: control-plane, context: ".", dockerfile: services/control-plane/Dockerfile }
          - { name: trust-plane, context: ".", dockerfile: services/trust-plane/Dockerfile }
          - { name: mcp-server, context: ".", dockerfile: services/mcp-server/Dockerfile }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.service.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: false
          tags: moat-${{ matrix.service.name }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  # ───────────────────────────────────────────────────────────────────────────
  # integration
  # Spin up the full Docker Compose stack and run end-to-end tests.
  # Runs on pushes to main and on pull requests.
  # ───────────────────────────────────────────────────────────────────────────
  integration:
    name: Integration Tests (Docker Compose)
    runs-on: ubuntu-latest
    needs: [test, docker]
    # Runs on PRs too: it only ever ran post-merge, so a broken stack reached main unseen.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Copy env file
        run: cp infra/local/.env.example infra/local/.env

      - name: Start Docker Compose stack
        run: |
          docker compose -f infra/local/docker-compose.yml up -d --build --wait --wait-timeout 120
          docker compose -f infra/local/docker-compose.yml ps

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8002/healthz && curl -sf http://localhost:8001/healthz; then
              echo "All services healthy"
              break
            fi
            echo "Waiting for services... ($i/30)"
            sleep 2
          done

      - name: Test gateway health
        run: |
          curl -sf http://localhost:8002/healthz | python3 -m json.tool
          curl -sf http://localhost:8001/healthz | python3 -m json.tool

      # Auth is disabled in infra/local/.env.example, so the tenant comes from
      # the X-Tenant-ID header. Capability IDs are server-assigned UUIDs and
      # policy bundles are only seeded in-process, so a freshly registered
      # capability must travel the whole pipeline (gateway -> control-plane
      # fetch -> policy) and be default-denied with no_policy_bundle.
      - name: Test execute pipeline (register, fetch, policy default-deny)
        run: |
          CAP=$(curl -sf -X POST http://localhost:8001/capabilities \
            -H 'Content-Type: application/json' -H 'X-Tenant-ID: ci-test' \
            -d '{"name":"ci-stub","description":"CI stub capability","provider":"stub","version":"1.0.0"}')
          CAP_ID=$(echo "$CAP" | python3 -c "import json,sys; print(json.load(sys.stdin)['capability_id'])")
          HTTP_CODE=$(curl -s -o /tmp/execute.json -w '%{http_code}' -X POST \
            "http://localhost:8002/execute/$CAP_ID" \
            -H 'Content-Type: application/json' -H 'X-Tenant-ID: ci-test' \
            -d '{"tenant_id":"ci-test","params":{"test":true},"scope":"execute"}')
          python3 -m json.tool /tmp/execute.json
          CAP_ID="$CAP_ID" HTTP_CODE="$HTTP_CODE" python3 -c "
          import json, os
          detail = json.load(open('/tmp/execute.json'))['detail']
          assert os.environ['HTTP_CODE'] == '403', os.environ['HTTP_CODE']
          assert detail['error'] == 'policy_denied', detail
          assert detail['rule_hit'] == 'no_policy_bundle', detail
          assert detail['capability_id'] == os.environ['CAP_ID'], detail
          assert detail['tenant_id'] == 'ci-test', detail
          print('Execute pipeline (policy default-deny): PASS')
          "

      - name: Test unregistered capability is rejected
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://localhost:8002/execute/nonexistent-cap \
            -H 'Content-Type: application/json' -H 'X-Tenant-ID: ci-test' \
            -d '{"tenant_id":"ci-test","params":{}}')
          if [ "$HTTP_CODE" = "404" ]; then
            echo "Unregistered capability: PASS (HTTP $HTTP_CODE)"
          else
            echo "Unregistered capability: FAIL (expected 404, got $HTTP_CODE)"
            exit 1
          fi

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f infra/local/docker-compose.yml logs > docker-compose-logs.txt

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-compose-logs
          path: docker-compose-logs.txt
          retention-days: 7

      - name: Teardown
        if: always()
        run: docker compose -f infra/local/docker-compose.yml down -v
